# DEVELOPMENT profile. Activate with SPRING_PROFILES_ACTIVE=dev.

app:
  mode: DEVELOPMENT
  
  # Kredensial cuma buat development. Bisa di-override pake BOOTSTRAP_OPERATOR_* di file .env.
  bootstrap:
    enabled: true
    operator-username: ${BOOTSTRAP_OPERATOR_USERNAME:operator}
    operator-password: ${BOOTSTRAP_OPERATOR_PASSWORD:dev-operator-password}
    operator-full-name: Development Operator

  security:
    jwt:
      secret: ${JWT_SECRET:dev-only-secret-key-change-me-in-every-real-environment}

  websocket:
  # Biarin authentication-nya nyala biar frontend-nya pakai CONNECT header yang sama kayak nanti di production.
  # WEBSOCKET_REQUIRE_AUTHENTICATION=false cuma boleh dipake kalau lagi debug transport-nya aja.
    require-authentication: ${WEBSOCKET_REQUIRE_AUTHENTICATION:true}

  mqtt:
  # Kalau false, bakalan pakai in-memory loopback transport, bukan koneksi ke broker.
  # Set MQTT_ENABLED=true kalau mau test pakai container Mosquitto dari docker-compose.
    enabled: ${MQTT_ENABLED:false}

  actuator:
    safety:
    # Keliatan di /api/dev/outbox biar developer edge-agent-nya bisa lihat field yang harus mereka hormati.
      command-ttl: ${ACTUATOR_COMMAND_TTL:60s}

  telemetry:
    # Data simulasi tidak berharga: buang cepat supaya database dev tidak membengkak.
    retention:
      readings-max-age: ${TELEMETRY_READINGS_MAX_AGE:7d}
      raw-messages-max-age: ${TELEMETRY_RAW_MESSAGES_MAX_AGE:1d}
      initial-delay: ${TELEMETRY_RETENTION_INITIAL_DELAY:30s}

  dev:
    simulator:
      enabled: ${DEV_SIMULATOR_ENABLED:true}
      # 30 detik sudah cukup bikin dashboard "hidup". 10 detik x 5 device x ~45 metrik = ±390 ribu baris
      # sensor_reading per hari - itu yang bikin database dev meledak.
      interval: ${DEV_SIMULATOR_INTERVAL:30s}
      
      # Range PLACEHOLDER cuma buat rendering aja. Kode device sama key metric-nya ngikutin katalog.
      devices:
        - code: JETSON-01
        # Ganti jadi BATTERY lewat POST /api/dev/devices/JETSON-01/status buat nyoba jalur outage-nya.
          power-source: MAINS
          metrics:
            - { key: trolley.station, min: 0, max: 0, scale: 0 }
            - { key: trolley.home_limit, min: 1, max: 1, scale: 0 }
            - { key: trolley.end_limit, min: 0, max: 0, scale: 0 }
            - { key: jetson.soc_temperature, min: 42, max: 58, scale: 1 }
        - code: PZEM-01
          metrics:
            - { key: mains.voltage, min: 215, max: 228, scale: 1 }
            - { key: mains.frequency, min: 49.9, max: 50.1, scale: 1 }
            - { key: mains.current, min: 0.28, max: 0.32, scale: 3 }
            - { key: mains.power, min: 55, max: 65, scale: 1 }
            - { key: mains.energy, min: 1.2, max: 1.3, scale: 3 }
            - { key: mains.power_factor, min: 0.85, max: 0.9, scale: 2 }
        - code: PANEL-01
        - code: GREENHOUSE-01
          metrics:
            - { key: soil_a.moisture, min: 55, max: 75, scale: 1 }
            - { key: soil_a.temperature, min: 25, max: 30, scale: 1 }
            - { key: soil_a.ec, min: 900, max: 1600, scale: 0 }
            - { key: soil_a.ph, min: 6.0, max: 6.8, scale: 2 }
            - { key: soil_a.nitrogen, min: 40, max: 90, scale: 0 }
            - { key: soil_a.phosphorus, min: 15, max: 40, scale: 0 }
            - { key: soil_a.potassium, min: 60, max: 140, scale: 0 }
            - { key: air.temperature, min: 26, max: 34, scale: 1 }
            - { key: air.humidity, min: 60, max: 85, scale: 1 }
            - { key: light.illuminance, min: 8000, max: 40000, scale: 0 }
        - code: RIO-TANK-01
          metrics:
            - { key: tank.ec, min: 1.5, max: 2.0, scale: 2 }
            - { key: tank.ph, min: 5.8, max: 6.4, scale: 2 }
            - { key: tank.water_temperature, min: 25, max: 29, scale: 1 }
            # 1 = air cukup. Set ke 0 untuk mencoba interlock FLOAT_LOW (pompa distribusi, dosing, aduk diblokir).
            - { key: tank.float_low_ok, min: 1, max: 1, scale: 0 }

logging:
  level:
    com.fertimata.backend: DEBUG
