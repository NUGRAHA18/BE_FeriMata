# Default configuration
spring:
  application:
    name: fertimata-backend

  # Katalog hardware ini ngejelasin device, sensor, sama actuator-nya
  # Arahkan HARDWARE_CATALOG_LOCATION (ini environment variable, bukan entry di .env)
  # ke file lain biar bisa jalanin hardware beda tanpa ubah kode.  
  config:
    import:
      - "optional:file:./.env[.properties]"
      - "optional:${HARDWARE_CATALOG_LOCATION:classpath:hardware/fertimata-rev-a.yml}"

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/fertimata}
    username: ${DATABASE_USERNAME:fertimata}
    password: ${DATABASE_PASSWORD:}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:10}

  jpa:
    open-in-view: false
    hibernate:
    # Schema-nya milik Flyway. Hibernate cuma ngecek apakah cocok sama entity-nya.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  jackson:
  # Null bakalan di-serialisasi secara eksplisit. Kalau nggak, field yang nggak ada sama field yang null 
  # bakalan kelihatan sama di sisi client. Padahal beberapa field emang sengaja null - misalnya actuator
  # yang belum ada state-nya, atau command yang belum dieksekusi. ApiError ngatur sendiri biar
  # map validation-details yang kosong nggak ikut dirender.
    default-property-inclusion: always

server:
  port: ${SERVER_PORT:8080}
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha

app:
  # DEVELOPMENT nyalain mock transport sama simulator. Jangan pernah diaktifin di environment yang udah di-deploy.
  mode: ${APP_MODE:PRODUCTION}

  bootstrap:
    enabled: ${BOOTSTRAP_ENABLED:true}
    operator-username: ${BOOTSTRAP_OPERATOR_USERNAME:}
    operator-password: ${BOOTSTRAP_OPERATOR_PASSWORD:}
    operator-full-name: ${BOOTSTRAP_OPERATOR_FULL_NAME:Operator}

  device:
  # TODO(hardware): masih sementara. Nanti ganti jadi kelipatan kecil dari interval heartbeat aslinya
  # begitu firmware edge device-nya udah fix interval-nya.
    offline-timeout: ${DEVICE_OFFLINE_TIMEOUT_SECONDS:120}s
    liveness-check-interval: ${DEVICE_LIVENESS_CHECK_INTERVAL_SECONDS:30}s
    auto-register: ${DEVICE_AUTO_REGISTER:true}

  catalog:
    # Sync katalog hardware yang di-import cuma buat create aja saat startup. Row yang udah ada nggak bakal diubah.
    enabled: ${HARDWARE_CATALOG_SYNC:true}

  actuator:
    safety:
      # List interlock (timed-types, blocked-on-backup-power-types, exclusive-type-groups) berasal dari
      # file katalog hardware. Dua yang ini lebih ke pilihan deployment, bukan fakta hardware.
      refuse-when-device-offline: ${ACTUATOR_REFUSE_WHEN_DEVICE_OFFLINE:false}
      # Batas waktu (expiry) buat command di kabel; edge agent bakalan buang yang udah kadaluarsa. Kalau nggak diisi berarti nggak ada field expiry-nya.
      command-ttl: ${ACTUATOR_COMMAND_TTL:}
    # Perintah yang tidak dijawab alat dalam waktu ini ditandai gagal (NO_RESPONSE). Edge menjawab segera,
    # patroli pun dijawab saat dimulai; ACK yang terlambat tetap mengubahnya menjadi berhasil.
    response:
      timeout: ${ACTUATOR_RESPONSE_TIMEOUT:2m}
      check-interval: 30s
      alert-window: 1h

  telemetry:
    auto-register-sensors: ${TELEMETRY_AUTO_REGISTER_SENSORS:true}
    max-clock-skew: ${TELEMETRY_MAX_CLOCK_SKEW_SECONDS:300}s
    max-metrics-per-message: ${TELEMETRY_MAX_METRICS_PER_MESSAGE:64}
    # Retensi. Tanpa ini sensor_reading + telemetry_message tumbuh tanpa batas (ratusan ribu baris/hari
    # pada interval 10 detik). Payload mentah cuma buat debugging kontrak, jadi umurnya pendek; pembacaan
    # ternormalisasi dipakai grafik riwayat, jadi disimpan lebih lama. Dihapus per batch kecil agar
    # tidak mengunci tabel.
    retention:
      enabled: ${TELEMETRY_RETENTION_ENABLED:true}
      readings-max-age: ${TELEMETRY_READINGS_MAX_AGE:30d}
      raw-messages-max-age: ${TELEMETRY_RAW_MESSAGES_MAX_AGE:3d}
      batch-size: ${TELEMETRY_RETENTION_BATCH_SIZE:5000}
      max-batches-per-run: ${TELEMETRY_RETENTION_MAX_BATCHES_PER_RUN:40}
      interval: ${TELEMETRY_RETENTION_INTERVAL:1h}
      initial-delay: ${TELEMETRY_RETENTION_INITIAL_DELAY:2m}
    # Ringkasan per jam (sensor_reading_hourly) untuk grafik jangka panjang; tidak dihapus retensi.
    # GET /api/sensors/{id}/history/aggregate membaca ringkasan ini + pembacaan mentah beberapa jam terakhir.
    history:
      rollup-interval: ${TELEMETRY_ROLLUP_INTERVAL:15m}
      rollup-initial-delay: ${TELEMETRY_ROLLUP_INITIAL_DELAY:1m}
      # Harus > rollup-interval: jam yang menerima data dalam rentang ini dihitung ulang tiap putaran.
      rollup-lookback: ${TELEMETRY_ROLLUP_LOOKBACK:2h}
      default-range: 7d
      target-points: 300
      max-points: 1000

  cultivation:
    # "Hari ini" untuk hitung HST (hari setelah transplant).
    zone: ${CULTIVATION_ZONE:Asia/Jakarta}
    # Fase tanam MENGIKUTI FUZZY TIM AI (keputusan 29 Okt 2026: "kode yang sudah ada di AI, ikut AI"):
    # Ai-code/app/ai/fuzzy_fertilizer FASE_MF (trapesium tumpang tindih). Batas tegas di sini = titik
    # keanggotaan 0,5 (tengah daerah tumpang tindih) supaya aplikasi bisa menulis "Hari ke-N - fase".
    # Target EC = inti himpunan "Optimal" EC fuzzy tingkat 2 AI (0,8 / 1,2-2,5 / 3), sama untuk semua fase.
    # Rasio N:P:K tidak dipakai lagi: target N/P/K mutlak ada di fuzzy AI.
    default-phases:
      - { code: SEMAI, name: Semai, start-hst: 0, end-hst: 7, ec-target-min: 1.2, ec-target-max: 2.5 }
      - { code: VEGETATIF, name: Vegetatif, start-hst: 8, end-hst: 24, ec-target-min: 1.2, ec-target-max: 2.5 }
      - { code: PEMBUNGAAN, name: Pembungaan, start-hst: 25, end-hst: 34, ec-target-min: 1.2, ec-target-max: 2.5 }
      - { code: PEMBUAHAN, name: Pembuahan, start-hst: 35, end-hst: 60, ec-target-min: 1.2, ec-target-max: 2.5 }
      - { code: PEMATANGAN, name: Pematangan, start-hst: 61, end-hst: 74, ec-target-min: 1.2, ec-target-max: 2.5 }
      - { code: PANEN, name: Panen, start-hst: 75, ec-target-min: 1.2, ec-target-max: 2.5 }

  calibration:
    # Nilai sensor/tegangan yang diisi otomatis (sampel lab, uji drift, kalibrasi pompa) tidak boleh lebih tua dari ini.
    reading-max-age: ${CALIBRATION_READING_MAX_AGE:15m}
    voltage-metric-key: mains.voltage
    # Protokol-Data.md s7 langkah 5: probe EC/pH dicek dengan larutan standar tiap minggu.
    drift-check:
      metric-keys: [tank.ec, tank.ph, soil_a.ec, soil_a.ph]
      max-age: ${CALIBRATION_DRIFT_MAX_AGE:7d}
    # Protokol-Data.md s8: debit pompa peristaltik, minimal 3 ulangan, rekalibrasi bulanan.
    pump:
      types: [DOSING_PUMP]
      max-age: ${CALIBRATION_PUMP_MAX_AGE:30d}
      min-trials: 3
    reminders:
      enabled: ${CALIBRATION_REMINDERS_ENABLED:true}
      interval: 6h
      initial-delay: 5m

  captures:
    # Folder foto trolley milik edge agent (camera.root, di Jetson /var/lib/fertimata/data/citra). Disajikan
    # read-only di /captures/** dengan otentikasi yang sama seperti API. Kosong = tidak disajikan.
    directory: ${CAPTURES_DIR:}
    # Foto tidak pernah berubah setelah ditulis, jadi browser boleh menyimpannya sebentar.
    cache-max-age: ${CAPTURES_CACHE_MAX_AGE:1d}

  security:
    jwt:
      # Sengaja nggak dikasih default: secret buat signing yang udah ikut di-ship sama aja artinya nggak ada authentication.
      secret: ${JWT_SECRET}
      issuer: ${JWT_ISSUER:fertimata-backend}
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL_MINUTES:60}m
      # Lama sesi tanpa login ulang. Token akses tetap pendek; klien memperpanjangnya diam-diam
      # lewat POST /api/auth/refresh selama refresh token masih hidup.
      refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL_DAYS:7}d
    cors:
      allowed-origins: ${FRONTEND_URL:http://localhost:3000}
      allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
      allowed-headers: "*"
      allow-credentials: true
      max-age: 1h

  websocket:
    endpoint: ${WEBSOCKET_ENDPOINT:/ws}
    allowed-origins: ${WEBSOCKET_ALLOWED_ORIGINS:${FRONTEND_URL:http://localhost:3000}}
    require-authentication: ${WEBSOCKET_REQUIRE_AUTHENTICATION:true}

  # Penyiraman terjadwal (keputusan 29 Okt 2026: dikerjakan backend; jam diisi lewat aplikasi).
  # Setiap jadwal di tabel irrigation_schedule menyalakan pompa siram dengan perintah berdurasi biasa,
  # jadi semua aturan keselamatan tetap berlaku.
  irrigation:
    enabled: ${IRRIGATION_SCHEDULE_ENABLED:true}
    actuator-code: ${IRRIGATION_ACTUATOR_CODE:DIST-PUMP}
    check-interval: 30s
    # Jadwal yang terlewat lebih lama dari ini (backend mati) tidak dikejar.
    grace: ${IRRIGATION_GRACE:15m}

  # GET /api/ai/inputs: input fuzzy layanan AI. Nama field = form di Swagger layanan AI (Ai-code);
  # nilai = metric key sensor backend. Ubah di sini bila tim AI mengganti arti sebuah field.
  ai:
    inputs:
      # Lebih tua dari ini = basi; field-nya null dan form tidak siap (S9).
      max-age: ${AI_INPUTS_MAX_AGE:15m}
      fertilization:
        ec: tank.ec
        # "pH" tanpa keterangan di Swagger AI; dipasangkan dengan EC larutan di fuzzy tingkat 2. Konfirmasi tim AI.
        ph: tank.ph
        nitrogen_tanah: soil_a.nitrogen
        phosfor_tanah: soil_a.phosphorus
        kalium_tanah: soil_a.potassium
      irrigation:
        ec_air: tank.ec
        suhu_air: tank.water_temperature
        suhu_udara: air.temperature
        rh: air.humidity
        humidity_tanah: soil_a.moisture
        temp_tanah: soil_a.temperature
        ph: soil_a.ph
        nitrogen: soil_a.nitrogen
        phosfor: soil_a.phosphorus
        kalium: soil_a.potassium
        ec_tanah: soil_a.ec

  # Notifikasi push (Web Push) ke HP untuk peringatan. Browser hanya mengizinkannya lewat HTTPS
  # (atau http://localhost). Buat kunci sekali: npx web-push generate-vapid-keys
  push:
    enabled: ${PUSH_ENABLED:false}
    vapid-public-key: ${VAPID_PUBLIC_KEY:}
    vapid-private-key: ${VAPID_PRIVATE_KEY:}
    # Kontak untuk server push; Apple menolak tanpa ini. mailto:... atau https://...
    vapid-subject: ${VAPID_SUBJECT:}
    min-severity: ${PUSH_MIN_SEVERITY:CRITICAL}
    # Notifikasi untuk HP yang sedang mati/offline disimpan server push selama ini.
    ttl: ${PUSH_TTL:24h}
    request-timeout: 10s
    # Server push Chrome/Android, Firefox, Edge dan Safari/iOS. Endpoint lain ditolak (cegah SSRF).
    allowed-endpoint-hosts:
      - fcm.googleapis.com
      - push.services.mozilla.com
      - notify.windows.com
      - push.apple.com

  mqtt:
    enabled: ${MQTT_ENABLED:true}
    broker-url: ${MQTT_BROKER_URL:tcp://localhost:1883}
    client-id: ${MQTT_CLIENT_ID:fertimata-backend}
    username: ${MQTT_USERNAME:}
    password: ${MQTT_PASSWORD:}
    qos: ${MQTT_QOS:1}
    keep-alive: 60s
    connection-timeout: 30s
    completion-timeout: 30s
    clean-start: false
    automatic-reconnect: true
    # Konvensi topik SEMENTARA. Naming-nya belum final sama tim hardware; semua topik di sistem ini
    # dibangun dari template-template ini, jadi ubah di sini aja bakal ngubah semuanya.
    # {deviceId} bakalan diganti sama kode device-nya.
    topics:
      telemetry: ${MQTT_TOPIC_TELEMETRY:fertimata/{deviceId}/telemetry}
      status: ${MQTT_TOPIC_STATUS:fertimata/{deviceId}/status}
      command: ${MQTT_TOPIC_COMMAND:fertimata/{deviceId}/command}
      command-ack: ${MQTT_TOPIC_COMMAND_ACK:fertimata/{deviceId}/command/ack}
      ai: ${MQTT_TOPIC_AI:fertimata/{deviceId}/ai}
      alert: ${MQTT_TOPIC_ALERT:fertimata/{deviceId}/alert}

logging:
  level:
    root: INFO
    com.fertimata.backend: ${LOG_LEVEL_APP:INFO}
    org.springframework.integration.mqtt: ${LOG_LEVEL_MQTT:INFO}
