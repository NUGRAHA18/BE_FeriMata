# Profile JETSON: deployment FERTIMATA Rev A. Aktifin dengan SPRING_PROFILES_ACTIVE=jetson.
#
# Semuanya jalan di satu Jetson Orin Nano 8GB: frontend, backend ini, PostgreSQL, model vision,
# sama edge agent yang ngomong Modbus/GPIO. Setting di bawah ini disesuaiin sama itu - broker lokal,
# connection pool kecil, sama penanganan command yang lebih ketat karena actuator-nya beneran.
#
# Tetep mode PRODUCTION: JWT_SECRET sama password operator-nya juga nggak punya default di sini.

spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://127.0.0.1:5432/fertimata}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:5}

server:
  # Dashboard diakses lewat Cloudflare Tunnel; hormati X-Forwarded-* dari proxy lokal.
  forward-headers-strategy: framework

app:
  device:
    # Katalog yang nge-provision semua device. Kode device yang nggak dikenal artinya agent-nya
    # salah konfigurasi, bukan greenhouse baru, jadi pesannya dicatat sebagai REJECTED, bukan bikin device baru.
    auto-register: ${DEVICE_AUTO_REGISTER:false}

  telemetry:
    # Masih nyala: metric yang nggak dikenal jadi sensor placeholder (disabled), biar datanya tetap ke-simpan buat ditinjau.
    auto-register-sensors: ${TELEMETRY_AUTO_REGISTER_SENSORS:true}
    # NVMe Jetson dibagi sama OS, model vision, dan database. 90 hari pembacaan ≈ satu musim tanam;
    # payload mentah cukup seminggu buat debugging edge agent.
    retention:
      readings-max-age: ${TELEMETRY_READINGS_MAX_AGE:90d}
      raw-messages-max-age: ${TELEMETRY_RAW_MESSAGES_MAX_AGE:7d}
      # Batch lebih kecil: CPU dibagi dengan inferensi.
      batch-size: ${TELEMETRY_RETENTION_BATCH_SIZE:2000}

  actuator:
    safety:
      # Session MQTT yang persistent bisa aja nganterin perintah "ON" yang ngantri begitu device nyala lagi.
      refuse-when-device-offline: ${ACTUATOR_REFUSE_WHEN_DEVICE_OFFLINE:true}
      command-ttl: ${ACTUATOR_COMMAND_TTL:30s}

  mqtt:
    enabled: ${MQTT_ENABLED:true}
    # Mosquitto di board yang sama, cuma di-bind ke loopback. Yang di luar Jetson nggak perlu MQTT.
    broker-url: ${MQTT_BROKER_URL:tcp://127.0.0.1:1883}