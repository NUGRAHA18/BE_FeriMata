# Integration-test profile. The datasource is supplied by Testcontainers via @ServiceConnection.
app:
  mode: DEVELOPMENT

  bootstrap:
    enabled: true
    operator-username: test-operator
    operator-password: test-operator-password
    operator-full-name: Integration Test Operator

  security:
    jwt:
      secret: integration-test-secret-key-at-least-32-characters
      issuer: fertimata-test
      access-token-ttl: 10m
      refresh-token-ttl: 7d
    cors:
      allowed-origins: http://localhost:3000

  websocket:
    endpoint: /ws
    allowed-origins: http://localhost:3000
    require-authentication: true

  actuator:
    response:
      timeout: 2m
      check-interval: 1h
      alert-window: 1h

  irrigation:
    enabled: true
    actuator-code: IT-PUMP
    # Tests call IrrigationScheduleRunner.runDue themselves.
    check-interval: 1h
    grace: 15m

  fertilization:
    enabled: true
    # Tests call FertilizationRunner.advance themselves.
    check-interval: 1h

  ai:
    inputs:
      max-age: 15m
      fertilization:
        ec: tank.ec
        ph: tank.ph
      irrigation:
        suhu_udara: air.temperature

  push:
    enabled: false
    min-severity: CRITICAL
    ttl: 24h
    request-timeout: 10s
    allowed-endpoint-hosts:
      - fcm.googleapis.com

  device:
    offline-timeout: 120s
    # Effectively disabled: the scheduler must not interfere with assertions.
    liveness-check-interval: 1h
    auto-register: true

  telemetry:
    auto-register-sensors: true
    max-clock-skew: 300s
    max-metrics-per-message: 64
    retention:
      # Off: a purge running mid-test would make row counts non-deterministic.
      enabled: false
      readings-max-age: 30d
      raw-messages-max-age: 3d
      batch-size: 1000
      max-batches-per-run: 10
      interval: 1h
      initial-delay: 1h
    history:
      # Tests call SensorReadingRollupJob.runOnce themselves.
      rollup-interval: 1h
      rollup-initial-delay: 1h
      rollup-lookback: 2h
      default-range: 7d
      target-points: 300
      max-points: 1000

  mqtt:
    # The loopback transport, so the tests need no broker.
    enabled: false
    topics:
      telemetry: fertimata/{deviceId}/telemetry
      status: fertimata/{deviceId}/status
      command: fertimata/{deviceId}/command
      command-ack: fertimata/{deviceId}/command/ack
      ai: fertimata/{deviceId}/ai
      alert: fertimata/{deviceId}/alert

  catalog:
    # The tests create their own fixtures; the hardware catalog would make counts depend on it.
    enabled: false

  cultivation:
    zone: Asia/Jakarta
    default-phases:
      # Sama dengan application.yml: FASE_MF fuzzy AI.
      - { code: SEMAI, name: Semai, start-hst: 0, end-hst: 7, ec-target-min: 1.2, ec-target-max: 2.5 }
      - { code: VEGETATIF, name: Vegetatif, start-hst: 8, end-hst: 24, ec-target-min: 1.2, ec-target-max: 2.5 }
      - { code: PEMBUNGAAN, name: Pembungaan, start-hst: 25, end-hst: 34, ec-target-min: 1.2, ec-target-max: 2.5 }
      - { code: PEMBUAHAN, name: Pembuahan, start-hst: 35, end-hst: 60, ec-target-min: 1.2, ec-target-max: 2.5 }
      - { code: PEMATANGAN, name: Pematangan, start-hst: 61, end-hst: 74, ec-target-min: 1.2, ec-target-max: 2.5 }
      - { code: PANEN, name: Panen, start-hst: 75, ec-target-min: 1.2, ec-target-max: 2.5 }

spring:
  jpa:
    hibernate:
      # Verifies that the Flyway schema and the JPA entities actually agree.
      ddl-auto: validate
  flyway:
    enabled: true

logging:
  level:
    com.fertimata.backend: INFO
    org.hibernate.SQL: WARN
