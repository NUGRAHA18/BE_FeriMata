# Local development stack: PostgreSQL, an MQTT broker and the backend.
#
# The backend can also run entirely without this stack - set MQTT_ENABLED=false and point
# DATABASE_URL at any PostgreSQL instance, including Supabase.
#
#   cp .env.example .env     # then fill in JWT_SECRET
#   docker compose up --build
#
# Values come from .env; nothing secret is written in this file.

# Same cap as deploy/: without it Docker's json-file logs grow without limit on a laptop left running.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    container_name: fertimata-postgres
    logging: *default-logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fertimata}
      POSTGRES_USER: ${DATABASE_USERNAME:-fertimata}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-fertimata}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME:-fertimata} -d ${POSTGRES_DB:-fertimata}"]
      interval: 10s
      timeout: 5s
      retries: 5

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: fertimata-mosquitto
    logging: *default-logging
    ports:
      - "${MQTT_PORT:-1883}:1883"
    volumes:
      - ./docker/mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fertimata-backend
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}

      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-fertimata}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-fertimata}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-fertimata}

      # Required. There is no default; set it in .env.
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER:-fertimata-backend}

      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      WEBSOCKET_ALLOWED_ORIGINS: ${WEBSOCKET_ALLOWED_ORIGINS:-http://localhost:3000}

      # Web Push for alerts (off until VAPID keys are set; see .env.example).
      PUSH_ENABLED: ${PUSH_ENABLED:-false}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      PUSH_MIN_SEVERITY: ${PUSH_MIN_SEVERITY:-CRITICAL}
      PUSH_TTL: ${PUSH_TTL:-24h}

      # Set MQTT_ENABLED=true in .env to exercise the real broker instead of the loopback transport.
      MQTT_ENABLED: ${MQTT_ENABLED:-true}
      MQTT_BROKER_URL: tcp://mosquitto:1883
      MQTT_USERNAME: ${MQTT_USERNAME:-}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}

      # Profile dev only. Set DEV_SIMULATOR_ENABLED=false when a real edge agent publishes to the
      # broker, otherwise simulated readings mix with the edge's.
      DEV_SIMULATOR_ENABLED: ${DEV_SIMULATOR_ENABLED:-true}
      DEV_SIMULATOR_INTERVAL: ${DEV_SIMULATOR_INTERVAL:-30s}

      BOOTSTRAP_OPERATOR_USERNAME: ${BOOTSTRAP_OPERATOR_USERNAME:-operator}
      BOOTSTRAP_OPERATOR_PASSWORD: ${BOOTSTRAP_OPERATOR_PASSWORD:-change-me}

volumes:
  postgres-data:
  mosquitto-data:
  mosquitto-log:
