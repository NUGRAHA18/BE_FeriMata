# Jetson broker configuration.
#
# Anonymous access is tolerated here only because the broker is never reachable from the network:
# compose publishes it on 127.0.0.1, and otherwise only containers on the stack's network see it.
# To require credentials, create a password file (mosquitto_passwd), mount it, replace the two
# lines below with "allow_anonymous false" + "password_file ...", and set MQTT_USERNAME/PASSWORD.

listener 1883
allow_anonymous true

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
